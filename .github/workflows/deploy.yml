# Publica o CIA EXPERIENCE no GitHub Pages a cada envio para a branch "main".
# As variáveis VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY são lidas de
# Settings → Secrets and variables → Actions → Variables (valores PÚBLICOS).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (versões travadas)
        run: npm ci

      - name: Auditoria de dependências (falha em vulnerabilidade alta/crítica)
        run: npm audit --omit=dev --audit-level=high

      - name: Testes automáticos (interpretador e endereços)
        run: npm test

      - name: Verificar se nenhuma chave secreta foi configurada por engano
        env:
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::VITE_SUPABASE_ANON_KEY não configurada — o site abrirá na tela de 'Configuração pendente'."; exit 0; fi
          case "$KEY" in sb_secret_*) echo "::error::A chave configurada é SECRETA (sb_secret_). Use a chave publishable/anon."; exit 1;; esac
          PAYLOAD=$(echo "$KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          if echo "$PAYLOAD" | grep -q '"role":"service_role"'; then echo "::error::A chave configurada é service_role. Use a chave anon/publishable."; exit 1; fi

      - name: Compilar
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Preparar para o GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
